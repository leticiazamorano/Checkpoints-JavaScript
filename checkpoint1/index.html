<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora-Checkpoint 1</title>
    <link rel="stylesheet" href="styles.css" />
<script src="script.js" defer></script>

</head>

<body>
    <main class="calculadora">
        <img src="carrinhosssss.jpg" width="100px" height="100px">
        <h2>Calculadora de Compras</h2>

        <div class="entrada">
            <input type="number" id="n1" placeholder="Preço Unitário" />
            <input type="number" id="n2" placeholder="Quantidade" />
        </div>

        <div class="botoes">
            <button onclick="multiplicar()">Calcular</button>
            <button onclick="limpar()">Limpar</button>
        </div>

        <p id="resultado">Valor a Pagar: </p>
    </main>

</body>

</html>
